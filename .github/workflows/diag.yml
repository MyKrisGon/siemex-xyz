name: Diagnóstico vista previa
on:
  push:
    branches: [diag]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 75
      - run: |
          for ua in "WhatsApp/2.24.20.79 A"; do
            for u in https://siemex.xyz/en/ https://siemex.xyz/en/index.html https://siemex.xyz/robots.txt https://siemex.xyz/sitemap.xml; do
              echo "=== $ua :: $u"
              curl -s -o /tmp/b -D - -A "$ua" --max-time 20 "$u" | head -12
              echo "--- body bytes: $(wc -c < /tmp/b)"; grep -o '<title>[^<]*\|og:title" content="[^"]*' /tmp/b | head -2; head -c 300 /tmp/b | tr '\n' ' '; echo
            done
          done
